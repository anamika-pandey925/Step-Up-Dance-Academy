<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <link rel="icon" type="image/svg+xml" href="/src/assets/favicon-circle.svg" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>
    Step Up Dance Academy | Nangloi Delhi & Bahadurgarh Haryana
  </title>

  <script>
    const originalWarn = console.warn;
    const originalError = console.error;
    
    console.warn = function(...args) {
      const msg = args.map(a => String(a)).join(' ');
      if (msg.includes('MetaMask') || msg.includes('ethereum') || msg.includes('THREE.Clock') || msg.includes('THREE.WebGLShadowMap') || msg.includes('warning X4122') || msg.includes('motion()')) {
        return;
      }
      originalWarn.apply(console, args);
    };
    
    console.error = function(...args) {
      const msg = args.map(a => String(a)).join(' ');
      if (msg.includes('MetaMask') || msg.includes('ethereum') || msg.includes('WebSocket connection failed')) {
        return;
      }
      originalError.apply(console, args);
    };
  </script>

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap"
    rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #080808;
      color: #ffffff;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
    }

    /* SCROLLBAR */

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #ff6b00;
      border-radius: 20px;
    }

    /* BACKGROUND GLOW */

    body::before {
      content: '';

      position: fixed;

      width: 500px;
      height: 500px;

      background: radial-gradient(circle,
          rgba(255, 107, 0, 0.25),
          transparent 70%);

      top: -150px;
      left: -100px;

      filter: blur(80px);

      z-index: -2;

      animation: blobMove 8s infinite alternate;
    }

    body::after {
      content: '';

      position: fixed;

      width: 400px;
      height: 400px;

      background: radial-gradient(circle,
          rgba(255, 157, 77, 0.15),
          transparent 70%);

      bottom: -120px;
      right: -100px;

      filter: blur(100px);

      z-index: -2;

      animation: blobMove2 10s infinite alternate;
    }

    @keyframes blobMove {
      from {
        transform: translateY(0px);
      }

      to {
        transform: translateY(60px);
      }
    }

    @keyframes blobMove2 {
      from {
        transform: translateX(0px);
      }

      to {
        transform: translateX(-50px);
      }
    }

    /* ROOT */

    #root {
      min-height: 100vh;
      position: relative;
      z-index: 2;
    }

    /* LOADING ANIMATION */

    .loading-screen {
      position: fixed;
      inset: 0;

      background: #080808;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 9999;
    }

    .loader-logo {
      width: 90px;
      height: 90px;

      border-radius: 50%;

      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid #ff6b00;

      animation: spin 1.2s linear infinite;

      box-shadow: 0 0 25px #ff6b00;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* GLOBAL BUTTON */

    .premium-btn {
      padding: 14px 34px;

      border: none;
      border-radius: 50px;

      background: #ff6b00;
      color: white;

      cursor: pointer;

      font-size: 16px;
      font-weight: 600;

      transition: 0.4s ease;

      box-shadow: 0 0 18px rgba(255, 107, 0, 0.5);
    }

    .premium-btn:hover {
      transform: translateY(-6px) scale(1.03);

      box-shadow: 0 0 35px rgba(255, 107, 0, 0.8);
    }

    /* GLASS EFFECT */

    .glass {
      background: rgba(255, 255, 255, 0.05);

      border: 1px solid rgba(255, 255, 255, 0.1);

      backdrop-filter: blur(16px);

      border-radius: 24px;
    }

    /* PREMIUM TEXT */

    .gradient-text {
      background: linear-gradient(90deg,
          #ffffff,
          #ff6b00,
          #ff9d4d,
          #ffffff);

      background-size: 300%;

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      animation: shine 6s linear infinite;
    }

    @keyframes shine {

      0% {
        background-position: 0%;
      }

      100% {
        background-position: 300%;
      }
    }
  </style>

</head>

<body>

  <div id="root"></div>

  <!-- REACT ENTRY -->
  <script type="module" src="/src/main.jsx"></script>

</body>

</html>
